# VibeNovel API — Cloudflare Worker (local dev via `npm run dev:api`)
# Do not commit secrets. Use `.dev.vars` locally (see `.dev.vars.example`).

name = "vibenovel-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[vars]
APP_ENV = "development"
ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:5174,http://localhost:5175"

# SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY → .dev.vars only

[dev]
port = 8787
local_protocol = "http"

# Task 11.1 — staging Mode A (safe default). Secrets via: wrangler secret put <NAME> --env staging
[env.staging]
name = "vibenovel-api-staging"

[env.staging.vars]
APP_ENV = "staging"
ALLOWED_ORIGINS = "https://vibenovel-web-staging.pages.dev"
CREDIT_TOPUP_ENABLED = "false"
PAYMENT_PROVIDER = "mock"
PAYMENT_PROVIDER_MOCK = "true"
PAYMENT_PROVIDER_MOCK_MODE = "success"
AI_GENERATION_ENABLED = "false"
AI_PROVIDER_MOCK = "true"
AI_MODEL_HEMAT = "google/gemini-2.5-flash:free"
AI_MODEL_SEIMBANG = "google/gemini-2.5-flash:free"
AI_MODEL_TERBAIK = "google/gemini-2.5-flash:free"
DEFAULT_AI_MODEL = "google/gemini-2.5-flash:free"

# Production API on Cloudflare Workers. Secrets are uploaded with:
#   npm run operator:production:worker-secrets -- -RequireLiveDuitku
[env.production]
name = "vibenovel-api"

[[env.production.routes]]
pattern = "api.narraza.web.id"
custom_domain = true

[env.production.vars]
APP_ENV = "production"
ALLOWED_ORIGINS = "https://narraza.web.id,https://www.narraza.web.id,https://app.narraza.web.id"

# Live AI provider.
AI_GENERATION_ENABLED = "true"
AI_PROVIDER_MOCK = "false"
OPENROUTER_BASE_URL = "https://openrouter.ai/api/v1"
AI_EMBEDDING_MODEL = "openai/text-embedding-3-small"
AI_MODEL_HEMAT = "google/gemini-2.5-flash:free"
AI_MODEL_SEIMBANG = "google/gemini-2.5-flash:free"
AI_MODEL_TERBAIK = "google/gemini-2.5-flash:free"
DEFAULT_AI_MODEL = "google/gemini-2.5-flash:free"

# Live Duitku provider. Keep secrets out of this file.
CREDIT_TOPUP_ENABLED = "true"
PAYMENT_PROVIDER = "duitku"
PAYMENT_PROVIDER_MOCK = "false"
DUITKU_ENV = "production"
DUITKU_CALLBACK_URL = "https://api.narraza.web.id/api/payments/duitku/callback"
DUITKU_RETURN_URL = "https://app.narraza.web.id/credits/topup/return"
